# Local backing services only. PHP is served by Laravel Herd (http://pathly.test).
services:
  postgres:
    image: postgres:17-alpine
    container_name: pathly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathly
      POSTGRES_USER: pathly
      POSTGRES_PASSWORD: secret
    ports:
      # Host port 5433 so it can run alongside other projects' Postgres on 5432
      - "5433:5432"
    volumes:
      - pathly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathly -d pathly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pathly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathly-postgres-data:
