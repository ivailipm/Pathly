name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres for `composer setup`, which runs migrations against .env.example (port 5433)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pathly
          POSTGRES_USER: pathly
          POSTGRES_PASSWORD: secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pathly -d pathly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
        # Run the tests on the Postgres service instead of phpunit.xml's SQLite (real env vars win),
        # so Postgres-only bugs such as ORDER BY inside an aggregate fail CI
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: pathly
